          # ROOT CAUSE of the black screen (found by reading Armored_Strike classes.dex):
          # the game's draw loop (RSLSurfaceView$a.run) is paced by System.currentTimeMillis() (com.requiem.a.aa timer):
          # "if (elapsed < gameTimerRate) SystemClock.sleep(rest)" and only otherwise lockCanvas()/draw.
          # The HLE returned 0 from currentTimeMillis() forever (elapsed always 0) and turned sleep() into a slice yield,
          # and every slice restarts run() (timer reset) -> the loop slept forever and never drew a frame.
          # Fix: real wall clock + virtual clock; sleep() inside a draw-thread slice advances the virtual clock and returns.
          import sys
          def patch(p, edits, marker):
              s = open(p).read()
              if marker in s:
                  print(p, 'already patched'); return
              for a, b in edits:
                  if s.count(a) != 1:
                      sys.exit('anchor missing or ambiguous (%d) in %s: %r' % (s.count(a), p, a[:90]))
                  s = s.replace(a, b, 1)
              open(p, 'w').write(s)
              print(p, 'patched')

