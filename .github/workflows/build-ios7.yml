          # for a hand-written target spec. The checked-in Cargo.lock may need a newer rustc than the pinned
          # nightly, so re-resolve it against package.rust-version instead.
          if [ "${KEEP_LOCK:-0}" != "1" ]; then
            rm -f Cargo.lock
            cargo +stable generate-lockfile --config 'resolver.incompatible-rust-versions="fallback"'
          fi

          export CARGO_PROFILE_RELEASE_PANIC=abort
          export CARGO_PROFILE_RELEASE_OPT_LEVEL=3
          export CARGO_PROFILE_RELEASE_LTO=off
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=4
          export RUSTFLAGS="${RUSTFLAGS:-} -C embed-bitcode=no"

