name: Build DonutHLE iOS 7 (armv7)

# SINGLE-FILE PORT: drop only this file into .github/workflows/ of an unmodified DonutHLE checkout and run it.
# It writes the whole ios/ app (Theos shell, target spec, shims) and patches the Rust core by itself:
#   - GPU op-stream recording in gles.rs + runtime.rs/lib.rs FFI (donuthle_gpu_*), VM natives for alpha/cull/fog/tex-env
#   - slice::as_chunks compat (the crate needs Rust 1.88 otherwise), zip without C-dependent features
# Then: Rust staticlib for armv7-apple-ios7 (-Zbuild-std) + Theos app, cross-compiled on Linux. Outputs .ipa and .deb.
# Toolchain/SDK steps follow ioskvm's ios.yml (Theos + L1ghtmann vanilla clang + iPhoneOS 9.3 SDK).

on:
  push:
    paths: [".github/workflows/build-ios7.yml"]
  workflow_dispatch: {}

env:
  RUST_NIGHTLY: nightly-2024-11-01
  IOS_DEPLOY_TARGET: "7.0"

jobs:
  build-ios-armv7:
    runs-on: ubuntu-24.04   # the iOS clang toolchain needs glibc >= 2.38
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Write DonutHLE iOS 7 sources (ios/)
        run: |
          set -e
          mkdir -p ios/targets ios/layout/DEBIAN
          cat > ios/DHAppDelegate.h <<'__DH_EOF__'
          #import <UIKit/UIKit.h>
          @interface DHAppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end
          __DH_EOF__
          cat > ios/DHAppDelegate.m <<'__DH_EOF__'
          #import "DHAppDelegate.h"
          #import "DHLibraryViewController.h"

          @implementation DHAppDelegate {
              UINavigationController *_nav;
              DHLibraryViewController *_library;
          }

          - (BOOL)application:(UIApplication *)app didFinishLaunchingWithOptions:(NSDictionary *)options {
              _library = [[DHLibraryViewController alloc] initWithStyle:UITableViewStylePlain];
              _nav = [[UINavigationController alloc] initWithRootViewController:_library];
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              self.window.rootViewController = _nav;
              [self.window makeKeyAndVisible];
              return YES;
          }

          // "Open in DonutHLE" for .apk files: copy into Documents so the library sees it.
          - (BOOL)application:(UIApplication *)app openURL:(NSURL *)url sourceApplication:(NSString *)src annotation:(id)anno {
              if (![url isFileURL]) return NO;
              NSString *docs = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES).firstObject;
              NSString *dest = [docs stringByAppendingPathComponent:[url lastPathComponent]];
              NSFileManager *fm = [NSFileManager defaultManager];
              if (![[url path] isEqualToString:dest]) {
                  [fm removeItemAtPath:dest error:nil];
                  [fm copyItemAtPath:[url path] toPath:dest error:nil];
              }
              [_nav popToRootViewControllerAnimated:NO];
              [_library reload];
              return YES;
          }
          @end
          __DH_EOF__
          cat > ios/DHBridge.h <<'__DH_EOF__'
          // C ABI exported by the Rust core (src/lib.rs, libdonuthle.a).
          #ifndef DHBRIDGE_H
          #define DHBRIDGE_H
          #include <stdint.h>
          #include <stddef.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          const char *donuthle_core_info(void);
          char *donuthle_launch_report(const char *apk_path);
          void donuthle_free_string(char *s);
          char *donuthle_game_title(void);
          uint32_t donuthle_framebuffer_width(void);
          uint32_t donuthle_framebuffer_height(void);
          size_t donuthle_framebuffer_copy(uint8_t *out, size_t out_len);
          uint32_t donuthle_render_frame(uint32_t w, uint32_t h);
          int32_t donuthle_touch(int32_t action, float x, float y);
          void donuthle_stop(void);
          void donuthle_gpu_enable(int32_t enabled);
          size_t donuthle_gpu_pending(void);
          size_t donuthle_gpu_take(uint8_t *out, size_t out_len);
          #ifdef __cplusplus
          }
          #endif
          #endif
          __DH_EOF__
          cat > ios/DHGameViewController.h <<'__DH_EOF__'
          #import <UIKit/UIKit.h>
          @interface DHGameViewController : UIViewController
          - (instancetype)initWithAPKPath:(NSString *)path;
          @end
          __DH_EOF__
          cat > ios/DHGameViewController.m <<'__DH_EOF__'
          #import "DHGameViewController.h"
          #import "DHScreenView.h"
          #import "DHRunner.h"
          #import "DHBridge.h"

          @interface DHGameViewController () <UIAlertViewDelegate>
          @end

          @implementation DHGameViewController {
              NSString *_path;
              DHScreenView *_screen;
              DHRunner *_runner;
              UILabel *_status;
          }

          - (instancetype)initWithAPKPath:(NSString *)path {
              if ((self = [super initWithNibName:nil bundle:nil])) {
                  _path = [path copy];
                  self.title = [[path lastPathComponent] stringByDeletingPathExtension];
              }
              return self;
          }

          - (void)loadView {
              self.view = [[UIView alloc] init];
              self.view.backgroundColor = [UIColor blackColor];
          }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.edgesForExtendedLayout = UIRectEdgeNone;
              _screen = [[DHScreenView alloc] initWithFrame:self.view.bounds];
              _screen.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.view addSubview:_screen];

              _status = [[UILabel alloc] initWithFrame:self.view.bounds];
              _status.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              _status.textAlignment = NSTextAlignmentCenter;
              _status.textColor = [UIColor whiteColor];
              _status.backgroundColor = [UIColor clearColor];
              _status.text = @"Booting\u2026";
              _status.userInteractionEnabled = NO;
              [self.view addSubview:_status];

              // Rendering mode: GPU replay by default; defaults write org.donuthle.ios software 1 forces the CPU rasterizer.
              BOOL gpu = ![[NSUserDefaults standardUserDefaults] boolForKey:@"software"];
              _screen.gpu = gpu;
              _runner = [[DHRunner alloc] initWithAPKPath:_path];
              _runner.gpu = gpu;
              __weak DHGameViewController *me = self;
              _runner.onLaunched = ^(NSString *report, BOOL failed) { [me launched:report failed:failed]; };
              DHRunner *runner = _runner;
              _screen.touchHandler = ^(int a, float x, float y) { [runner touchAction:a x:x y:y]; };
              [_runner start];
          }

          - (void)launched:(NSString *)report failed:(BOOL)failed {
              _status.hidden = YES;
              char *t = donuthle_game_title();
              if (t) { if (!failed) self.title = [NSString stringWithUTF8String:t]; donuthle_free_string(t); }
              if (failed) {
                  [[[UIAlertView alloc] initWithTitle:@"Launch failed" message:report delegate:self
                                    cancelButtonTitle:@"Back" otherButtonTitles:nil] show];
              }
          }

          - (void)alertView:(UIAlertView *)a clickedButtonAtIndex:(NSInteger)i {
              [self.navigationController popViewControllerAnimated:YES];
          }

          - (void)viewWillDisappear:(BOOL)animated {
              [super viewWillDisappear:animated];
              if ([self.navigationController.viewControllers containsObject:self]) return; // still on the stack
              [_screen stopPresenting];
              [_runner stopAndWait];
              _runner = nil;
          }

          - (BOOL)shouldAutorotate { return YES; }
          - (UIInterfaceOrientationMask)supportedInterfaceOrientations { return UIInterfaceOrientationMaskAll; }
          @end
          __DH_EOF__
          cat > ios/DHLibraryViewController.h <<'__DH_EOF__'
          #import <UIKit/UIKit.h>
          @interface DHLibraryViewController : UITableViewController
          - (void)reload;
          @end
          __DH_EOF__
          cat > ios/DHLibraryViewController.m <<'__DH_EOF__'
          #import "DHLibraryViewController.h"
          #import "DHGameViewController.h"

          @implementation DHLibraryViewController {
              NSArray *_apks; // file names in Documents
          }

          - (NSString *)docsPath {
              return NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES).firstObject;
          }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"DonutHLE";
              self.navigationItem.rightBarButtonItem =
                  [[UIBarButtonItem alloc] initWithBarButtonSystemItem:UIBarButtonSystemItemRefresh target:self action:@selector(reload)];
              UILabel *hint = [[UILabel alloc] initWithFrame:CGRectMake(0, 0, 320, 120)];
              hint.numberOfLines = 0;
              hint.textAlignment = NSTextAlignmentCenter;
              hint.textColor = [UIColor grayColor];
              hint.font = [UIFont systemFontOfSize:13];
              hint.text = @"\nPut .apk files into this app's Documents folder\n(iTunes File Sharing, Filza, SSH)\nor use \u201cOpen in\u2026 DonutHLE\u201d.\n\nAndroid 1.x (API 1\u20134) only. Experimental.";
              self.tableView.tableFooterView = hint;
              [self reload];
          }

          - (void)viewWillAppear:(BOOL)animated { [super viewWillAppear:animated]; [self reload]; }

          - (void)reload {
              NSArray *all = [[NSFileManager defaultManager] contentsOfDirectoryAtPath:[self docsPath] error:nil] ?: @[];
              NSMutableArray *apks = [NSMutableArray array];
              for (NSString *n in all) if ([[n pathExtension] caseInsensitiveCompare:@"apk"] == NSOrderedSame) [apks addObject:n];
              _apks = [apks sortedArrayUsingSelector:@selector(caseInsensitiveCompare:)];
              [self.tableView reloadData];
          }

          - (NSInteger)tableView:(UITableView *)tv numberOfRowsInSection:(NSInteger)s { return (NSInteger)_apks.count; }

          - (UITableViewCell *)tableView:(UITableView *)tv cellForRowAtIndexPath:(NSIndexPath *)ip {
              UITableViewCell *c = [tv dequeueReusableCellWithIdentifier:@"apk"];
              if (!c) c = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:@"apk"];
              NSString *name = _apks[ip.row];
              NSDictionary *at = [[NSFileManager defaultManager] attributesOfItemAtPath:[[self docsPath] stringByAppendingPathComponent:name] error:nil];
              c.textLabel.text = name;
              c.detailTextLabel.text = [NSString stringWithFormat:@"%.1f MB", [at fileSize] / 1048576.0];
              c.accessoryType = UITableViewCellAccessoryDisclosureIndicator;
              return c;
          }

          - (void)tableView:(UITableView *)tv didSelectRowAtIndexPath:(NSIndexPath *)ip {
              [tv deselectRowAtIndexPath:ip animated:YES];
              NSString *path = [[self docsPath] stringByAppendingPathComponent:_apks[ip.row]];
              [self.navigationController pushViewController:[[DHGameViewController alloc] initWithAPKPath:path] animated:YES];
          }
          @end
          __DH_EOF__
          cat > ios/DHRunner.h <<'__DH_EOF__'
          #import <Foundation/Foundation.h>

          // Owns the thread that runs the Dalvik VM. The interpreter recurses deeply, so it gets a large stack
          // (secondary threads default to 512 KB). All VM entry points (launch, render, touch) run on this one thread.
          @interface DHRunner : NSObject
          @property (nonatomic) BOOL gpu; // must be set before -start
          @property (nonatomic, copy) void (^onLaunched)(NSString *report, BOOL failed); // called on the main queue
          - (instancetype)initWithAPKPath:(NSString *)path;
          - (void)start;
          - (void)stopAndWait;
          - (void)touchAction:(int)action x:(float)x y:(float)y; // Android MotionEvent actions: 0 down, 1 up, 2 move, 3 cancel
          @end
          __DH_EOF__
          cat > ios/DHRunner.m <<'__DH_EOF__'
          #import "DHRunner.h"
          #import "DHBridge.h"

          typedef struct { int action; float x, y; } DHTouch;

          @implementation DHRunner {
              NSString *_path;
              NSThread *_thread;
              NSMutableArray *_touches;      // NSValue(DHTouch), guarded by @synchronized(_touches)
              NSConditionLock *_done;        // 0 = running, 1 = finished
              volatile BOOL _stop;
          }

          - (instancetype)initWithAPKPath:(NSString *)path {
              if ((self = [super init])) {
                  _path = [path copy];
                  _touches = [NSMutableArray array];
                  _gpu = YES;
                  _done = [[NSConditionLock alloc] initWithCondition:1];
              }
              return self;
          }

          - (void)start {
              [_done lock]; [_done unlockWithCondition:0];
              _thread = [[NSThread alloc] initWithTarget:self selector:@selector(run) object:nil];
              _thread.name = @"DonutHLE VM";
              _thread.stackSize = 16 * 1024 * 1024;
              [_thread start];
          }

          - (void)stopAndWait {
              _stop = YES;
              [_done lockWhenCondition:1];
              [_done unlock];
          }

          - (void)touchAction:(int)action x:(float)x y:(float)y {
              DHTouch t = { action, x, y };
              @synchronized (_touches) {
                  if (_touches.count < 256) [_touches addObject:[NSValue valueWithBytes:&t objCType:@encode(DHTouch)]];
              }
          }

          - (void)run {
              @autoreleasepool {
                  donuthle_gpu_enable(self.gpu ? 1 : 0);
                  char *raw = donuthle_launch_report([_path fileSystemRepresentation]);
                  NSString *report = raw ? [NSString stringWithUTF8String:raw] : @"Runtime returned no report";
                  if (raw) donuthle_free_string(raw);
                  BOOL failed = [report hasPrefix:@"Runtime error"];
                  dispatch_async(dispatch_get_main_queue(), ^{ if (self.onLaunched) self.onLaunched(report, failed); });

                  const double frame = 1.0 / 30.0;
                  while (!failed && !_stop) {
                      @autoreleasepool {
                          NSArray *pending = nil;
                          @synchronized (_touches) { pending = [_touches copy]; [_touches removeAllObjects]; }
                          for (NSValue *v in pending) {
                              DHTouch t; [v getValue:&t];
                              donuthle_touch(t.action, t.x, t.y);
                          }
                          // GPU mode: let the presenter catch up instead of piling up frames (also pauses while backgrounded)
                          while (!_stop && donuthle_gpu_pending() > 6u * 1024 * 1024) [NSThread sleepForTimeInterval:0.004];
                          NSTimeInterval t0 = [NSDate timeIntervalSinceReferenceDate];
                          donuthle_render_frame(320, 480);
                          NSTimeInterval spent = [NSDate timeIntervalSinceReferenceDate] - t0;
                          if (spent < frame) [NSThread sleepForTimeInterval:frame - spent];
                      }
                  }
                  donuthle_stop();
              }
              [_done lock]; [_done unlockWithCondition:1];
          }
          @end
          __DH_EOF__
          cat > ios/DHScreenView.h <<'__DH_EOF__'
          #import <UIKit/UIKit.h>
          // Presents the core's software framebuffer (RGBA8) aspect-fit and reports touches in virtual-screen coordinates.
          @interface DHScreenView : UIView
          @property (nonatomic) BOOL gpu; // replay the core's GLES op stream on the GPU (default) vs. present a CPU-rendered frame
          @property (nonatomic, copy) void (^touchHandler)(int action, float x, float y);
          - (void)stopPresenting;
          @end
          __DH_EOF__
          cat > ios/DHScreenView.m <<'__DH_EOF__'
          #import "DHScreenView.h"
          #import "DHBridge.h"
          #import <QuartzCore/QuartzCore.h>
          #import <OpenGLES/EAGL.h>
          #import <OpenGLES/ES1/gl.h>
          #import <OpenGLES/ES1/glext.h>
          #include <string.h>
          #include <math.h>

          enum { OP_FRAME_END = 0, OP_CLEAR = 1, OP_TEX_IMAGE = 2, OP_TEX_PARAM = 3, OP_TEX_DELETE = 4, OP_DRAW = 5, OP_PIXEL_QUAD = 6 };
          #define MAX_TEX 4096

          typedef struct {            // mirrors gles.rs gpu_state(), 304 bytes
              uint32_t flags, bsrc, bdst, tex;
              int32_t vp[4], sc[4];
              float proj[16], mv[16], tm[16];
              uint32_t alphaFunc; float alphaRef;
              uint32_t depthFunc, cullMode, frontFace, fogMode;
              float fogDensity, fogStart, fogEnd, fogColor[4];
              uint32_t texEnv, shade, reserved;
          } DHState;

          typedef struct {
              GLuint name;
              uint32_t w, h;               // size of the image the app uploaded
              uint32_t minF, magF, wrapS, wrapT;
              uint8_t *src;                // RGBA copy, kept only when the GPU copy has to be rebuilt (NPOT / oversized)
          } DHTex;

          static inline uint32_t rd32(const uint8_t *p) { uint32_t v; memcpy(&v, p, 4); return v; }
          static inline float rdf(const uint8_t *p) { float v; memcpy(&v, p, 4); return v; }

          // Two modes:
          //  * GPU (default): the Rust core records its GLES calls as an op stream (donuthle_gpu_*); this view replays
          //    them with the real GPU through OpenGL ES 1.1 (textures, blending, depth, scissor, matrices).
          //  * Software fallback: the core rasterizes on the CPU and this view just uploads the finished frame.
          // (software path) GLES 1.1 presenter (every armv7 iOS 7 device has ES1): uploads the core's RGBA8 framebuffer into a
          // power-of-two texture and draws it as one aspect-fit quad, same approach as the Android native_bridge.
          @implementation DHScreenView {
              CADisplayLink *_link;
              EAGLContext *_ctx;
              GLuint _fbo, _rbo, _tex;
              GLint _bw, _bh;               // backing size in pixels
              uint32_t _fw, _fh;            // core framebuffer size
              GLsizei _tw, _th;             // texture size (POT)
              uint8_t *_buf;
              size_t _bufCap;
              BOOL _dirtyStorage;
              // GPU replay
              GLuint _depthRbo;
              GLint _maxTex;
              DHTex *_texs;
              uint8_t *_ops;
              size_t _opsCap;
              float _scale, _rx, _ry;       // virtual->backing scale and letterbox origin (top-left, pixels)
              uint32_t _vw, _vh;
              BOOL _needClear;
          }

          @synthesize gpu = _gpu;

          + (Class)layerClass { return [CAEAGLLayer class]; }

          static GLsizei nextPOT(uint32_t v) { GLsizei r = 1; while ((uint32_t)r < v && r < 4096) r <<= 1; return r; }

          - (instancetype)initWithFrame:(CGRect)f {
              if ((self = [super initWithFrame:f])) {
                  self.backgroundColor = [UIColor blackColor];
                  self.multipleTouchEnabled = NO;
                  self.contentScaleFactor = [UIScreen mainScreen].scale;
                  CAEAGLLayer *l = (CAEAGLLayer *)self.layer;
                  l.opaque = YES;
                  _gpu = YES;
                  // Retained: the software renderer's framebuffer persists between frames, so games may not clear.
                  l.drawableProperties = @{ kEAGLDrawablePropertyRetainedBacking: @YES,
                                            kEAGLDrawablePropertyColorFormat: kEAGLColorFormatRGBA8 };
                  _ctx = [[EAGLContext alloc] initWithAPI:kEAGLRenderingAPIOpenGLES1];
                  _fw = 320; _fh = 480;
                  _dirtyStorage = YES;
                  _link = [CADisplayLink displayLinkWithTarget:self selector:@selector(tick:)];
                  _link.frameInterval = 2; // ~30 fps
                  [_link addToRunLoop:[NSRunLoop mainRunLoop] forMode:NSRunLoopCommonModes];
                  NSNotificationCenter *nc = [NSNotificationCenter defaultCenter];
                  [nc addObserver:self selector:@selector(pause) name:UIApplicationWillResignActiveNotification object:nil];
                  [nc addObserver:self selector:@selector(resume) name:UIApplicationDidBecomeActiveNotification object:nil];
              }
              return self;
          }

          // GL work in the background gets the process killed, so stop presenting while inactive.
          - (void)pause  { _link.paused = YES; if (_ctx) { [EAGLContext setCurrentContext:_ctx]; glFinish(); } }
          - (void)resume { _link.paused = NO; }

          - (void)layoutSubviews { [super layoutSubviews]; _dirtyStorage = YES; }

          - (void)rebuildStorage {
              [EAGLContext setCurrentContext:_ctx];
              if (!_fbo) { glGenFramebuffersOES(1, &_fbo); glGenRenderbuffersOES(1, &_rbo); }
              glBindFramebufferOES(GL_FRAMEBUFFER_OES, _fbo);
              glBindRenderbufferOES(GL_RENDERBUFFER_OES, _rbo);
              [_ctx renderbufferStorage:GL_RENDERBUFFER_OES fromDrawable:(CAEAGLLayer *)self.layer];
              glFramebufferRenderbufferOES(GL_FRAMEBUFFER_OES, GL_COLOR_ATTACHMENT0_OES, GL_RENDERBUFFER_OES, _rbo);
              glGetRenderbufferParameterivOES(GL_RENDERBUFFER_OES, GL_RENDERBUFFER_WIDTH_OES, &_bw);
              glGetRenderbufferParameterivOES(GL_RENDERBUFFER_OES, GL_RENDERBUFFER_HEIGHT_OES, &_bh);
              if (_gpu) {
                  if (!_depthRbo) glGenRenderbuffersOES(1, &_depthRbo);
                  glBindRenderbufferOES(GL_RENDERBUFFER_OES, _depthRbo);
                  const char *ext = (const char *)glGetString(GL_EXTENSIONS);
                  BOOL d24 = ext && strstr(ext, "GL_OES_depth24");
                  glRenderbufferStorageOES(GL_RENDERBUFFER_OES, d24 ? GL_DEPTH_COMPONENT24_OES : GL_DEPTH_COMPONENT16_OES, _bw, _bh);
                  if (!_maxTex) glGetIntegerv(GL_MAX_TEXTURE_SIZE, &_maxTex);
                  glFramebufferRenderbufferOES(GL_FRAMEBUFFER_OES, GL_DEPTH_ATTACHMENT_OES, GL_RENDERBUFFER_OES, _depthRbo);
                  glBindRenderbufferOES(GL_RENDERBUFFER_OES, _rbo);
              }
              _needClear = YES;
              _dirtyStorage = NO;
          }

          - (void)ensureTextureForW:(uint32_t)w h:(uint32_t)h {
              GLsizei tw = nextPOT(w), th = nextPOT(h);
              if (_tex && tw == _tw && th == _th) return;
              if (!_tex) glGenTextures(1, &_tex);
              glBindTexture(GL_TEXTURE_2D, _tex);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);
              glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA, tw, th, 0, GL_RGBA, GL_UNSIGNED_BYTE, NULL);
              _tw = tw; _th = th;
          }

          - (void)tick:(CADisplayLink *)l {
              if (!_ctx || self.bounds.size.width < 1) return;
              if (_gpu) [self tickGPU]; else [self tickSoftware];
          }

          - (void)tickSoftware {
              uint32_t w = donuthle_framebuffer_width(), h = donuthle_framebuffer_height();
              if (w == 0 || h == 0) return;
              size_t n = (size_t)w * h * 4;
              if (n > _bufCap) { free(_buf); _buf = malloc(n); _bufCap = _buf ? n : 0; }
              if (!_buf || donuthle_framebuffer_copy(_buf, n) != n) return;
              _fw = w; _fh = h;

              [EAGLContext setCurrentContext:_ctx];
              if (_dirtyStorage) [self rebuildStorage];
              [self ensureTextureForW:w h:h];

              glBindFramebufferOES(GL_FRAMEBUFFER_OES, _fbo);
              glViewport(0, 0, _bw, _bh);
              glClearColor(0, 0, 0, 1);
              glClear(GL_COLOR_BUFFER_BIT);

              glBindTexture(GL_TEXTURE_2D, _tex);
              glPixelStorei(GL_UNPACK_ALIGNMENT, 1);
              glTexSubImage2D(GL_TEXTURE_2D, 0, 0, 0, w, h, GL_RGBA, GL_UNSIGNED_BYTE, _buf);

              // aspect-fit rect in backing pixels
              GLfloat s = MIN((GLfloat)_bw / w, (GLfloat)_bh / h);
              GLfloat qw = w * s, qh = h * s, x0 = (_bw - qw) / 2, y0 = (_bh - qh) / 2;
              const GLfloat verts[] = { x0, y0, x0 + qw, y0, x0, y0 + qh, x0 + qw, y0 + qh };
              GLfloat u = (GLfloat)w / _tw, v = (GLfloat)h / _th;
              const GLfloat uvs[] = { 0, 0, u, 0, 0, v, u, v };

              glMatrixMode(GL_PROJECTION); glLoadIdentity();
              glOrthof(0, _bw, _bh, 0, -1, 1);   // y down, like the Android shell
              glMatrixMode(GL_MODELVIEW); glLoadIdentity();
              glDisable(GL_DEPTH_TEST); glDisable(GL_BLEND); glDisable(GL_CULL_FACE); glDisable(GL_LIGHTING);
              glEnable(GL_TEXTURE_2D);
              glTexEnvf(GL_TEXTURE_ENV, GL_TEXTURE_ENV_MODE, GL_REPLACE);
              glColor4f(1, 1, 1, 1);
              glEnableClientState(GL_VERTEX_ARRAY);
              glEnableClientState(GL_TEXTURE_COORD_ARRAY);
              glVertexPointer(2, GL_FLOAT, 0, verts);
              glTexCoordPointer(2, GL_FLOAT, 0, uvs);
              glDrawArrays(GL_TRIANGLE_STRIP, 0, 4);
              glDisableClientState(GL_TEXTURE_COORD_ARRAY);
              glDisableClientState(GL_VERTEX_ARRAY);

              glBindRenderbufferOES(GL_RENDERBUFFER_OES, _rbo);
              [_ctx presentRenderbuffer:GL_RENDERBUFFER_OES];
          }


          // ---------------------------------------------------------------- GPU replay
          - (DHTex *)texFor:(uint32_t)i {
              if (i == 0 || i >= MAX_TEX) i = 0;      // slot 0 is the 1x1 white texture
              if (!_texs) _texs = calloc(MAX_TEX, sizeof(DHTex));
              DHTex *t = &_texs[i];
              if (!t->name) {
                  glGenTextures(1, &t->name);
                  glBindTexture(GL_TEXTURE_2D, t->name);
                  const uint8_t white[4] = { 255, 255, 255, 255 };
                  glPixelStorei(GL_UNPACK_ALIGNMENT, 1);
                  glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA, 1, 1, 0, GL_RGBA, GL_UNSIGNED_BYTE, white);
                  // same defaults as the software renderer's white_texture()
                  t->w = t->h = 1; t->minF = t->magF = GL_NEAREST; t->wrapS = t->wrapT = GL_REPEAT;
                  [self applyParams:t uploadedW:1 uploadedH:1];
              }
              return t;
          }

          static BOOL isPOT(uint32_t v) { return v && !(v & (v - 1)); }
          static uint32_t nextPOT32(uint32_t v) { uint32_t r = 1; while (r < v) r <<= 1; return r; }
          static BOOL isMipFilter(uint32_t f) { return f >= 0x2700 && f <= 0x2703; }

          // Nearest or bilinear RGBA resample (used to turn NPOT / oversized images into POT ones).
          static void resampleRGBA(const uint8_t *src, uint32_t sw, uint32_t sh, uint8_t *dst, uint32_t dw, uint32_t dh, BOOL nearest) {
              for (uint32_t y = 0; y < dh; y++) {
                  float fy = (y + 0.5f) * sh / dh - 0.5f;
                  for (uint32_t x = 0; x < dw; x++) {
                      float fx = (x + 0.5f) * sw / dw - 0.5f;
                      uint8_t *o = dst + ((size_t)y * dw + x) * 4;
                      if (nearest) {
                          uint32_t sx = MIN(sw - 1, (uint32_t)((x + 0.5f) * sw / dw));
                          uint32_t sy = MIN(sh - 1, (uint32_t)((y + 0.5f) * sh / dh));
                          memcpy(o, src + ((size_t)sy * sw + sx) * 4, 4);
                          continue;
                      }
                      int x0 = (int)floorf(fx), y0 = (int)floorf(fy);
                      float tx = fx - x0, ty = fy - y0;
                      int xa = MAX(0, MIN((int)sw - 1, x0)), xb = MAX(0, MIN((int)sw - 1, x0 + 1));
                      int ya = MAX(0, MIN((int)sh - 1, y0)), yb = MAX(0, MIN((int)sh - 1, y0 + 1));
                      const uint8_t *p00 = src + ((size_t)ya * sw + xa) * 4, *p10 = src + ((size_t)ya * sw + xb) * 4;
                      const uint8_t *p01 = src + ((size_t)yb * sw + xa) * 4, *p11 = src + ((size_t)yb * sw + xb) * 4;
                      for (int c = 0; c < 4; c++) {
                          float v = p00[c] * (1 - tx) * (1 - ty) + p10[c] * tx * (1 - ty) + p01[c] * (1 - tx) * ty + p11[c] * tx * ty;
                          o[c] = (uint8_t)(v + 0.5f);
                      }
                  }
              }
          }

          // Sampler state for the bound texture, given the size actually uploaded (gw x gh).
          // ES1 only allows mipmaps and REPEAT on power-of-two textures; NPOT uploads use CLAMP_TO_EDGE and plain filters.
          - (void)applyParams:(DHTex *)t uploadedW:(uint32_t)gw uploadedH:(uint32_t)gh {
              BOOL pot = isPOT(gw) && isPOT(gh);
              GLenum minF = t->minF, magF = t->magF, ws = t->wrapS, wt = t->wrapT;
              if (!pot) {
                  if (minF == 0x2700 || minF == 0x2702) minF = GL_NEAREST;
                  if (minF == 0x2701 || minF == 0x2703) minF = GL_LINEAR;
                  ws = wt = GL_CLAMP_TO_EDGE;
              }
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, minF);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, magF);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, ws);
              glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, wt);
          }

          // (Re)creates the GPU image from `pixels` (w x h) honoring the texture's current wrap/filter settings.
          //  - POT and within GL_MAX_TEXTURE_SIZE: uploaded as is.
          //  - NPOT with CLAMP_TO_EDGE and no mip filter: uploaded as is (limited-NPOT rules).
          //  - otherwise (NPOT + REPEAT or mipmaps, or oversized): resampled to POT so wrapping/mipmaps keep working.
          - (void)uploadTex:(DHTex *)t pixels:(const uint8_t *)pixels {
              uint32_t w = t->w, h = t->h;
              BOOL pot = isPOT(w) && isPOT(h), mip = isMipFilter(t->minF);
              BOOL fits = (GLint)w <= _maxTex && (GLint)h <= _maxTex;
              BOOL clamped = t->wrapS == GL_CLAMP_TO_EDGE && t->wrapT == GL_CLAMP_TO_EDGE;
              BOOL asIs = fits && (pot || (clamped && !mip));
              uint32_t gw = w, gh = h;
              uint8_t *tmp = NULL;
              const uint8_t *data = pixels;
              if (!asIs) {
                  gw = MIN(nextPOT32(w), (uint32_t)_maxTex); gh = MIN(nextPOT32(h), (uint32_t)_maxTex);
                  tmp = malloc((size_t)gw * gh * 4);
                  if (!tmp) return;
                  resampleRGBA(pixels, w, h, tmp, gw, gh, t->magF == GL_NEAREST);
                  data = tmp;
              }
              glBindTexture(GL_TEXTURE_2D, t->name);
              glPixelStorei(GL_UNPACK_ALIGNMENT, 1);
              glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA, gw, gh, 0, GL_RGBA, GL_UNSIGNED_BYTE, data);
              [self applyParams:t uploadedW:gw uploadedH:gh];
              if (mip && isPOT(gw) && isPOT(gh)) glGenerateMipmapOES(GL_TEXTURE_2D);
              free(tmp);
          }

          - (void)texImage:(const uint8_t *)p {
              uint32_t id = rd32(p), w = rd32(p + 4), h = rd32(p + 8);
              if (id == 0 || id >= MAX_TEX || w == 0 || h == 0 || w > 8192 || h > 8192) return;
              DHTex *t = [self texFor:id];
              t->w = w; t->h = h;
              free(t->src); t->src = NULL;
              BOOL needsRebuild = !(isPOT(w) && isPOT(h)) || (GLint)w > _maxTex || (GLint)h > _maxTex;
              if (needsRebuild) {                       // keep the source: a later wrap/filter change re-derives the GPU image
                  t->src = malloc((size_t)w * h * 4);
                  if (t->src) memcpy(t->src, p + 12, (size_t)w * h * 4);
              }
              [self uploadTex:t pixels:p + 12];
          }

          - (void)texParam:(const uint8_t *)p {
              uint32_t id = rd32(p), pname = rd32(p + 4), v = rd32(p + 8);
              if (id == 0 || id >= MAX_TEX) return;
              DHTex *t = [self texFor:id];
              uint32_t oldMin = t->minF;
              switch (pname) {
                  case 0x2801: t->minF = v; break;
                  case 0x2800: t->magF = v; break;
                  case 0x2802: t->wrapS = v; break;
                  case 0x2803: t->wrapT = v; break;
                  default: return;
              }
              glBindTexture(GL_TEXTURE_2D, t->name);
              if (t->src) { [self uploadTex:t pixels:t->src]; return; }
              // POT texture already on the GPU: only the sampler changes (and mipmaps if a mip filter was just turned on)
              [self applyParams:t uploadedW:t->w uploadedH:t->h];
              if (isMipFilter(t->minF) && !isMipFilter(oldMin) && isPOT(t->w) && isPOT(t->h)) glGenerateMipmapOES(GL_TEXTURE_2D);
          }

          - (void)texDelete:(const uint8_t *)p {
              uint32_t id = rd32(p);
              if (id == 0 || id >= MAX_TEX || !_texs || !_texs[id].name) return;
              glDeleteTextures(1, &_texs[id].name);
              free(_texs[id].src);
              memset(&_texs[id], 0, sizeof(DHTex));
          }

          // virtual (top-left origin) rect -> GL window rect (bottom-left origin), clipped to the letterbox
          - (void)glRectX:(int)x y:(int)y w:(int)w h:(int)h out:(GLint *)o {
              float bx = _rx + x * _scale, by = _ry + y * _scale, bw = w * _scale, bh = h * _scale;
              o[0] = (GLint)lroundf(bx); o[2] = (GLint)lroundf(bw);
              o[3] = (GLint)lroundf(bh); o[1] = _bh - (GLint)lroundf(by + bh);
          }

          - (void)applyState:(const DHState *)st pixelSpace:(BOOL)px {
              GLint r[4];
              [self glRectX:(px ? 0 : st->vp[0]) y:(px ? 0 : st->vp[1]) w:(px ? (int)_vw : st->vp[2]) h:(px ? (int)_vh : st->vp[3]) out:r];
              glViewport(r[0], r[1], r[2], r[3]);

              GLint lb[4]; [self glRectX:0 y:0 w:(int)_vw h:(int)_vh out:lb];    // letterbox: never draw into the bars
              GLint sc[4] = { lb[0], lb[1], lb[2], lb[3] };
              if (st->flags & 4) {
                  GLint g[4]; [self glRectX:st->sc[0] y:st->sc[1] w:st->sc[2] h:st->sc[3] out:g];
                  GLint x0 = MAX(lb[0], g[0]), y0 = MAX(lb[1], g[1]);
                  GLint x1 = MIN(lb[0] + lb[2], g[0] + g[2]), y1 = MIN(lb[1] + lb[3], g[1] + g[3]);
                  sc[0] = x0; sc[1] = y0; sc[2] = MAX(0, x1 - x0); sc[3] = MAX(0, y1 - y0);
              }
              glEnable(GL_SCISSOR_TEST);
              glScissor(sc[0], sc[1], sc[2], sc[3]);

              if (st->flags & 1) { glEnable(GL_BLEND); glBlendFunc(st->bsrc, st->bdst); } else glDisable(GL_BLEND);
              if ((st->flags & 2) && !px) glEnable(GL_DEPTH_TEST); else glDisable(GL_DEPTH_TEST);
              glDepthFunc(st->depthFunc);
              glDepthMask((st->flags & 16) ? GL_TRUE : GL_FALSE);
              if (st->flags & 32) { glEnable(GL_ALPHA_TEST); glAlphaFunc(st->alphaFunc, st->alphaRef); } else glDisable(GL_ALPHA_TEST);
              if ((st->flags & 64) && !px) { glEnable(GL_CULL_FACE); glCullFace(st->cullMode); glFrontFace(st->frontFace); }
              else glDisable(GL_CULL_FACE);
              if ((st->flags & 128) && !px) {
                  glEnable(GL_FOG);
                  glFogf(GL_FOG_MODE, (GLfloat)st->fogMode);
                  glFogf(GL_FOG_DENSITY, st->fogDensity); glFogf(GL_FOG_START, st->fogStart); glFogf(GL_FOG_END, st->fogEnd);
                  glFogfv(GL_FOG_COLOR, st->fogColor);
              } else glDisable(GL_FOG);
              glTexEnvf(GL_TEXTURE_ENV, GL_TEXTURE_ENV_MODE, (GLfloat)st->texEnv);
              glShadeModel(st->shade);
              if (st->flags & 8) {
                  glEnable(GL_TEXTURE_2D);
                  glBindTexture(GL_TEXTURE_2D, [self texFor:st->tex]->name);
              } else glDisable(GL_TEXTURE_2D);

              glMatrixMode(GL_PROJECTION);
              if (px) { glLoadIdentity(); glOrthof(0, _vw, _vh, 0, -1, 1); } else glLoadMatrixf(st->proj);
              glMatrixMode(GL_TEXTURE);
              if (px) glLoadIdentity(); else glLoadMatrixf(st->tm);
              glMatrixMode(GL_MODELVIEW);
              if (px) glLoadIdentity(); else glLoadMatrixf(st->mv);
              glPointSize(MAX(1.f, _scale)); glLineWidth(MAX(1.f, _scale));
          }

          - (void)replayDraw:(const uint8_t *)p {
              uint32_t mode = rd32(p), count = rd32(p + 4);
              if (count == 0 || mode > 6) return;
              DHState st; memcpy(&st, p + 8, sizeof st);
              const uint8_t *v = p + 8 + sizeof st;
              [self applyState:&st pixelSpace:NO];
              glEnableClientState(GL_VERTEX_ARRAY); glEnableClientState(GL_TEXTURE_COORD_ARRAY); glEnableClientState(GL_COLOR_ARRAY);
              glVertexPointer(3, GL_FLOAT, 24, v);
              glTexCoordPointer(2, GL_FLOAT, 24, v + 12);
              glColorPointer(4, GL_UNSIGNED_BYTE, 24, v + 20);
              glDrawArrays(mode, 0, (GLsizei)count);
          }

          - (void)replayQuad:(const uint8_t *)p {
              DHState st; memcpy(&st, p, sizeof st);
              const uint8_t *q = p + sizeof st;
              float x = rdf(q), y = rdf(q + 4), w = rdf(q + 8), h = rdf(q + 12);
              float u0 = rdf(q + 16), v0 = rdf(q + 20), u1 = rdf(q + 24), v1 = rdf(q + 28);
              const uint8_t *c = q + 32;
              [self applyState:&st pixelSpace:YES];
              const GLfloat pos[8] = { x, y, x + w, y, x, y + h, x + w, y + h };
              const GLfloat uv[8] = { u0, v0, u1, v0, u0, v1, u1, v1 };
              glDisableClientState(GL_COLOR_ARRAY);
              glColor4ub(c[0], c[1], c[2], c[3]);
              glEnableClientState(GL_VERTEX_ARRAY); glEnableClientState(GL_TEXTURE_COORD_ARRAY);
              glVertexPointer(2, GL_FLOAT, 0, pos);
              glTexCoordPointer(2, GL_FLOAT, 0, uv);
              glDrawArrays(GL_TRIANGLE_STRIP, 0, 4);
          }

          - (void)replayClear:(const uint8_t *)p {
              uint32_t mask = rd32(p);
              const uint8_t *c = p + 4;
              uint32_t scOn = rd32(p + 8);
              GLint lb[4]; [self glRectX:0 y:0 w:(int)_vw h:(int)_vh out:lb];
              GLint sc[4] = { lb[0], lb[1], lb[2], lb[3] };
              if (scOn) {
                  GLint g[4]; [self glRectX:(int)rd32(p + 12) y:(int)rd32(p + 16) w:(int)rd32(p + 20) h:(int)rd32(p + 24) out:g];
                  GLint x0 = MAX(lb[0], g[0]), y0 = MAX(lb[1], g[1]);
                  GLint x1 = MIN(lb[0] + lb[2], g[0] + g[2]), y1 = MIN(lb[1] + lb[3], g[1] + g[3]);
                  sc[0] = x0; sc[1] = y0; sc[2] = MAX(0, x1 - x0); sc[3] = MAX(0, y1 - y0);
              }
              glEnable(GL_SCISSOR_TEST);
              glScissor(sc[0], sc[1], sc[2], sc[3]);
              glDepthMask(GL_TRUE);
              glClearColor(c[0] / 255.f, c[1] / 255.f, c[2] / 255.f, c[3] / 255.f);
              glClearDepthf(1.f);
              GLbitfield m = 0;
              if (mask & 0x4000) m |= GL_COLOR_BUFFER_BIT;
              if (mask & 0x0100) m |= GL_DEPTH_BUFFER_BIT;
              if (m) glClear(m);
          }

          - (void)tickGPU {
              size_t pending = donuthle_gpu_pending();
              if (pending == 0) return;
              size_t want = pending + pending / 4 + 4096;     // the core may queue another frame meanwhile
              if (want > _opsCap) { free(_ops); _ops = malloc(want); _opsCap = _ops ? want : 0; }
              if (!_ops) return;
              size_t n = donuthle_gpu_take(_ops, _opsCap);
              if (n == 0) return;

              // find where the newest frame starts: older frames only contribute their texture ops
              size_t lastStart = 0, prevEnd = 0;
              for (size_t o = 0; o + 8 <= n;) {
                  uint32_t op = rd32(_ops + o), len = rd32(_ops + o + 4);
                  if (o + 8 + len > n) { n = o; break; }       // truncated, ignore the rest
                  o += 8 + len;
                  if (op == OP_FRAME_END && len >= 8) {
                      lastStart = prevEnd; prevEnd = o;
                      uint32_t w = rd32(_ops + o - len), h = rd32(_ops + o - len + 4);
                      if (w && h) { _vw = w; _vh = h; _fw = w; _fh = h; }
                  }
              }
              if (prevEnd == 0) return;                         // no complete frame yet
              n = prevEnd;
              // NOTE: ops after the last FRAME_END (none, the core publishes whole frames) are discarded.

              [EAGLContext setCurrentContext:_ctx];
              if (_dirtyStorage) [self rebuildStorage];

              glBindFramebufferOES(GL_FRAMEBUFFER_OES, _fbo);
              glDisable(GL_CULL_FACE); glDisable(GL_LIGHTING); glDisable(GL_FOG); glDisable(GL_ALPHA_TEST); glDisable(GL_DITHER);
              glTexEnvf(GL_TEXTURE_ENV, GL_TEXTURE_ENV_MODE, GL_MODULATE);

              _scale = MIN((float)_bw / _vw, (float)_bh / _vh);
              _rx = (_bw - _vw * _scale) / 2; _ry = (_bh - _vh * _scale) / 2;
              if (_needClear) {
                  glDisable(GL_SCISSOR_TEST); glClearColor(0, 0, 0, 1);
                  glClear(GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT);
                  _needClear = NO;
              }

              for (size_t o = 0; o < n;) {
                  uint32_t op = rd32(_ops + o), len = rd32(_ops + o + 4);
                  const uint8_t *p = _ops + o + 8;
                  BOOL older = o < lastStart;
                  switch (op) {
                      case OP_TEX_IMAGE:  [self texImage:p]; break;
                      case OP_TEX_PARAM:  [self texParam:p]; break;
                      case OP_TEX_DELETE: [self texDelete:p]; break;
                      default: break;
                  }
                  if (!older) {
                      switch (op) {
                          case OP_CLEAR: [self replayClear:p]; break;
                          case OP_DRAW: [self replayDraw:p]; break;
                          case OP_PIXEL_QUAD: [self replayQuad:p]; break;
                          default: break;
                      }
                  }
                  o += 8 + len;
              }
              glDisableClientState(GL_COLOR_ARRAY); glDisableClientState(GL_TEXTURE_COORD_ARRAY); glDisableClientState(GL_VERTEX_ARRAY);
              glDisable(GL_SCISSOR_TEST);
              glBindRenderbufferOES(GL_RENDERBUFFER_OES, _rbo);
              [_ctx presentRenderbuffer:GL_RENDERBUFFER_OES];
          }

          - (void)stopPresenting {
              [_link invalidate]; _link = nil;
              [[NSNotificationCenter defaultCenter] removeObserver:self];
              if (_ctx) {
                  [EAGLContext setCurrentContext:_ctx];
                  if (_tex) { glDeleteTextures(1, &_tex); _tex = 0; }
                  if (_fbo) { glDeleteFramebuffersOES(1, &_fbo); _fbo = 0; }
                  if (_rbo) { glDeleteRenderbuffersOES(1, &_rbo); _rbo = 0; }
                  if (_depthRbo) { glDeleteRenderbuffersOES(1, &_depthRbo); _depthRbo = 0; }
                  if (_texs) { for (int i = 0; i < MAX_TEX; i++) { if (_texs[i].name) glDeleteTextures(1, &_texs[i].name); free(_texs[i].src); } free(_texs); _texs = NULL; }
                  glFinish();
                  [EAGLContext setCurrentContext:nil];
                  _ctx = nil;
              }
          }

          - (void)dealloc { [self stopPresenting]; free(_buf); free(_ops); }

          // ---- touches: view points -> virtual screen coordinates (aspect-fit) ----
          - (CGRect)canvasRect {
              CGSize b = self.bounds.size;
              CGFloat s = MIN(b.width / _fw, b.height / _fh);
              CGFloat w = _fw * s, h = _fh * s;
              return CGRectMake((b.width - w) / 2, (b.height - h) / 2, w, h);
          }

          - (void)send:(UITouch *)t action:(int)action {
              if (!self.touchHandler) return;
              CGPoint pt = [t locationInView:self];
              CGRect r = [self canvasRect];
              float x = (float)((pt.x - r.origin.x) * _fw / r.size.width);
              float y = (float)((pt.y - r.origin.y) * _fh / r.size.height);
              x = MAX(0.f, MIN(x, (float)_fw - 1.f));
              y = MAX(0.f, MIN(y, (float)_fh - 1.f));
              self.touchHandler(action, x, y);
          }
          - (void)touchesBegan:(NSSet *)ts withEvent:(UIEvent *)e { [self send:ts.anyObject action:0]; }
          - (void)touchesMoved:(NSSet *)ts withEvent:(UIEvent *)e { [self send:ts.anyObject action:2]; }
          - (void)touchesEnded:(NSSet *)ts withEvent:(UIEvent *)e { [self send:ts.anyObject action:1]; }
          - (void)touchesCancelled:(NSSet *)ts withEvent:(UIEvent *)e { [self send:ts.anyObject action:3]; }
          @end
          __DH_EOF__
          cat > ios/DHShims.c <<'__DH_EOF__'
          /*
           * Shims for libSystem symbols that Rust's std may reference but that iOS 7 does not have:
           *   CCRandomGenerateBytes (iOS 8), clock_gettime / clock_gettime_nsec_np (iOS 10),
           *   os_unfair_lock_* (iOS 10).
           * Defining them in the executable makes the static link bind to these instead of the
           * newer-OS stubs in the SDK, so they never turn into runtime dyld failures on iOS 7.
           * Do NOT include <time.h> declarations of these from a newer SDK; this is built against SDK 9.3.
           */
          #include <stdint.h>
          #include <stddef.h>
          #include <stdlib.h>
          #include <sched.h>
          #include <time.h>
          #include <sys/time.h>
          #include <mach/mach_time.h>

          int32_t CCRandomGenerateBytes(void *bytes, size_t count) {
              arc4random_buf(bytes, count);
              return 0; /* kCCSuccess */
          }

          static uint64_t dh_mach_nsec(void) {
              static mach_timebase_info_data_t tb;
              if (tb.denom == 0) mach_timebase_info(&tb);
              uint64_t t = mach_absolute_time();
              return (t / tb.denom) * tb.numer + ((t % tb.denom) * tb.numer) / tb.denom;
          }

          uint64_t clock_gettime_nsec_np(int clk_id) {
              if (clk_id == 0) { /* CLOCK_REALTIME */
                  struct timeval tv;
                  gettimeofday(&tv, NULL);
                  return (uint64_t)tv.tv_sec * 1000000000ull + (uint64_t)tv.tv_usec * 1000ull;
              }
              return dh_mach_nsec(); /* MONOTONIC(6), MONOTONIC_RAW(4), UPTIME_RAW(8), CPU-time clocks */
          }

          int clock_gettime(int clk_id, struct timespec *ts) {
              if (!ts) return -1;
              uint64_t ns = clock_gettime_nsec_np(clk_id);
              ts->tv_sec = (time_t)(ns / 1000000000ull);
              ts->tv_nsec = (long)(ns % 1000000000ull);
              return 0;
          }

          typedef struct { uint32_t opaque; } dh_unfair_lock;

          void os_unfair_lock_lock(dh_unfair_lock *l) {
              while (__sync_lock_test_and_set(&l->opaque, 1u)) sched_yield();
          }
          int os_unfair_lock_trylock(dh_unfair_lock *l) {
              return __sync_lock_test_and_set(&l->opaque, 1u) == 0;
          }
          void os_unfair_lock_unlock(dh_unfair_lock *l) {
              __sync_lock_release(&l->opaque);
          }

          /* std::fs::copy on Apple tries clonefile(2) (macOS 10.12 / iOS 10) first and falls back on ENOTSUP. */
          #include <errno.h>
          int fclonefileat(int srcfd, int dst_dirfd, const char *dst, int flags) {
              (void)srcfd; (void)dst_dirfd; (void)dst; (void)flags;
              errno = ENOTSUP;
              return -1;
          }
          int fclonefile(int srcfd, const char *dst, int flags) {
              (void)srcfd; (void)dst; (void)flags;
              errno = ENOTSUP;
              return -1;
          }
          int clonefile(const char *src, const char *dst, int flags) {
              (void)src; (void)dst; (void)flags;
              errno = ENOTSUP;
              return -1;
          }
          __DH_EOF__
