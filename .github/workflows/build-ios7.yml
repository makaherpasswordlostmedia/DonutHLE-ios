          #!/usr/bin/env bash
          # Builds libdonuthle.a for armv7 / iOS 7.0 (32-bit). Run from anywhere.
          # Needs: nightly toolchain with rust-src (see RUST_NIGHTLY), a normal stable cargo for lockfile resolution.
          set -euo pipefail
