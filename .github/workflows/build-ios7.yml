           ('static NANO_TIME_START: OnceLock<std::time::Instant> = OnceLock::new();\n',
            """static NANO_TIME_START: OnceLock<std::time::Instant> = OnceLock::new();
          static VIRTUAL_MS: std::sync::atomic::AtomicI64 = std::sync::atomic::AtomicI64::new(0);
          static SLEEP_RUN: std::sync::atomic::AtomicU32 = std::sync::atomic::AtomicU32::new(0);

          /// Milliseconds since the VM clock started: real time plus time "slept" by cooperative threads.
          fn clock_ms() -> i64 {
              let start = NANO_TIME_START.get_or_init(std::time::Instant::now);
              start.elapsed().as_millis() as i64 + VIRTUAL_MS.load(std::sync::atomic::Ordering::Relaxed)
          }
          """),
           ('            return Ok(Value::Long(clock.elapsed().as_nanos() as i64));\n',
            '            return Ok(Value::Long(\n                clock.elapsed().as_nanos() as i64\n                    + VIRTUAL_MS.load(std::sync::atomic::Ordering::Relaxed) * 1_000_000,\n            ));\n'),
           ('                "currentTimeMillis" => return Ok(Value::Long(0)),\n',
            '                "currentTimeMillis" => return Ok(Value::Long(1_700_000_000_000 + clock_ms())),\n'),
