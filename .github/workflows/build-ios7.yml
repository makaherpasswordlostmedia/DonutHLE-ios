      - name: Install Rust (stable for lockfile resolution, pinned nightly + rust-src for build-std)
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rust-src

      - name: Build libdonuthle.a (armv7 / iOS 7)
        run: bash ios/build-rust-ios.sh

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y curl xz-utils bzip2 zip unzip fakeroot make perl

      - name: Install Theos + iOS cross toolchain
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" -o /tmp/ios-toolchain.tar.xz
          tar -xf /tmp/ios-toolchain.tar.xz -C "$THEOS/toolchain"
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/sdk.tbz2 "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          # clang 19 rejects the legacy module.map name
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            if [ -f "$fw/module.map" ]; then mkdir -p "$fw/Modules"; mv "$fw/module.map" "$fw/Modules/module.modulemap"; fi
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do mv "$m" "$(dirname "$m")/module.modulemap"; done
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Build .app / .deb via Theos
        working-directory: ios
        run: |
          make clean
          make package FINALPACKAGE=1 SDK_ROOT="$SDK_ROOT" V=1
          ls -la packages

      - name: Check binary for symbols iOS 7 does not have
        run: |
          BIN="$(find ios/.theos -type f -name DonutHLE -perm -u+x | head -n1)"
          [ -n "$BIN" ] || { echo "::error::binary not found"; exit 1; }
          TOOLBIN="$THEOS/toolchain/linux/iphone/bin"
          NM="$(ls "$TOOLBIN"/llvm-nm 2>/dev/null | head -n1)"; [ -z "$NM" ] && NM="$(command -v llvm-nm || command -v nm)"
          "$NM" -u "$BIN" > /tmp/undef.txt || true
          echo "undefined symbols: $(wc -l < /tmp/undef.txt)"
          # hard failures: these are shimmed in ios/DHShims.c, or break at first use on iOS 7
          HARD='_CCRandomGenerateBytes|_clock_gettime|_clock_gettime_nsec_np|_os_unfair_lock|___tlv_bootstrap|_getentropy|___isPlatformVersionAtLeast|___isOSVersionAtLeast|___availability_version_check'
          if grep -E "$HARD" /tmp/undef.txt; then echo "::error::binary imports symbols missing on iOS 7"; exit 1; fi
          # soft warnings: iOS 8+/10+ libc calls, only fatal if actually reached
          grep -E '_openat|_fstatat|_fdopendir|_futimens|_utimensat|_timespec_get|_aligned_alloc|_posix_spawn' /tmp/undef.txt && echo "::warning::iOS 8+ libc symbols imported (see list above)" || true
          if command -v otool >/dev/null 2>&1; then LC="$(otool -l "$BIN")"; else LC="$("$TOOLBIN"/llvm-objdump --macho --private-headers "$BIN" 2>/dev/null || true)"; fi
          echo "$LC" | grep -E "LC_MAIN|LC_VERSION_MIN|LC_BUILD_VERSION|minos|LC_DYLD_CHAINED_FIXUPS" | head -10 || true
          if echo "$LC" | grep -E "LC_DYLD_CHAINED_FIXUPS|LC_DYLD_EXPORTS_TRIE"; then echo "::error::linker emitted load commands iOS 7 dyld does not know"; exit 1; fi

      - name: Pack .ipa
        run: |
          rm -rf ipa_build; mkdir -p ipa_build/Payload
          APP="ios/.theos/_/Applications/DonutHLE.app"
          [ -x "$APP/DonutHLE" ] || { echo "::error::$APP/DonutHLE missing"; exit 1; }
          cp -a "$APP" ipa_build/Payload/
          (cd ipa_build && zip -rq "$GITHUB_WORKSPACE/ios/packages/DonutHLE-armv7-iOS7.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: DonutHLE-iOS7-armv7
          path: |
            ios/packages/*.ipa
            ios/packages/*.deb
