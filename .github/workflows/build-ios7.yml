           ('                0x20 => {\n                    let dest = ((instruction >> 8) & 0xff) as usize;\n                    let source = ((instruction >> 12) & 0x0f) as usize;',
            '                0x20 => {\n                    let dest = ((instruction >> 8) & 0x0f) as usize;\n                    let source = ((instruction >> 12) & 0x0f) as usize;'),
           ('                    pc += 1;\n                }\n                0x21 => {',
            '                    pc += 2;\n                }\n                0x21 => {'),
           ('                0x2a => {\n                    let offset = code_word(code, pc + 1, pc, opcode)? as i16 as i32;\n                    pc = branch_target(pc, offset, code.instructions.len(), pc, opcode)?;\n                }\n',
            '                0x2a => {\n                    let low = code_word(code, pc + 1, pc, opcode)? as u32;\n                    let high = code_word(code, pc + 2, pc, opcode)? as u32;\n                    let offset = (low | high << 16) as i32;\n                    pc = branch_target(pc, offset, code.instructions.len(), pc, opcode)?;\n                }\n                0x2b | 0x2c => {\n                    let register = ((instruction >> 8) & 0xff) as usize;\n                    let value =\n                        as_int(get_register(&registers, register, pc, opcode)?, pc, opcode)?;\n                    let low = code_word(code, pc + 1, pc, opcode)? as u32;\n                    let high = code_word(code, pc + 2, pc, opcode)? as u32;\n                    let payload = branch_target(\n                        pc,\n                        (low | high << 16) as i32,\n                        code.instructions.len(),\n                        pc,\n                        opcode,\n                    )?;\n                    let ident = code_word(code, payload, pc, opcode)?;\n                    let size = code_word(code, payload + 1, pc, opcode)? as usize;\n                    let mut jump: Option<i32> = None;\n                    let read_i32 = |at: usize| -> Result<i32, VmError> {\n                        let lo = code_word(code, at, pc, opcode)? as u32;\n                        let hi = code_word(code, at + 1, pc, opcode)? as u32;\n                        Ok((lo | hi << 16) as i32)\n                    };\n                    if opcode == 0x2b {\n                        if ident != 0x0100 {\n                            return Err(self.error(pc, opcode, "packed-switch payload is invalid"));\n                        }\n                        let first = read_i32(payload + 2)?;\n                        let diff = i64::from(value) - i64::from(first);\n                        if diff >= 0 && (diff as usize) < size {\n                            jump = Some(read_i32(payload + 4 + diff as usize * 2)?);\n                        }\n                    } else {\n                        if ident != 0x0200 {\n                            return Err(self.error(pc, opcode, "sparse-switch payload is invalid"));\n                        }\n                        for entry in 0..size {\n                            if read_i32(payload + 2 + entry * 2)? == value {\n                                jump = Some(read_i32(payload + 2 + size * 2 + entry * 2)?);\n                                break;\n                            }\n                        }\n                    }\n                    match jump {\n                        Some(offset) => {\n                            pc = branch_target(pc, offset, code.instructions.len(), pc, opcode)?;\n                        }\n                        None => pc += 3,\n                    }\n                }\n'),
