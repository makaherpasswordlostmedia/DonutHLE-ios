          # std assumes Apple targets always have native __thread TLS (needs iOS 9+ on armv7). iOS 7 has none, so the
          # target sets has-thread-local=false and std must use its pthread-key based TLS, which it only enables
          # for non-Apple unix. Allow it for Apple when target_thread_local is off.
          set +e
          STD_SRC="$(rustc "+$RUST_NIGHTLY" --print sysroot)/lib/rustlib/src/rust/library/std/src/sys"
          set -e
          python3 - "$STD_SRC/thread_local/mod.rs" <<'PYEOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          if 'all(target_vendor = "apple", target_thread_local)' in s:
              print("rust-src already patched")
              sys.exit(0)
          pat = re.compile(r'not\(target_vendor = "apple"\),(\s*)not\(target_family = "wasm"\),(\s*)target_family = "unix",')
          new, n = pat.subn(r'not(all(target_vendor = "apple", target_thread_local)),\1not(target_family = "wasm"),\2target_family = "unix",', s)
          if n != 1:
              sys.exit("could not patch %s: expected 1 match for the thread_local key cfg, got %d" % (p, n))
          open(p, "w").write(new)
          print("patched", p)
          PYEOF

          set +e
          echo "::group::target cfg"
          rustc "+$RUST_NIGHTLY" --print cfg --target "$TARGET_JSON" -Z unstable-options 2>&1 | grep -E '^(unix|target_(family|os|vendor|thread_local))' | sort
          echo "::endgroup::"
          set -e

          cargo "+$RUST_NIGHTLY" rustc --release --lib --crate-type staticlib \
            --target "$TARGET_JSON" \
            -Z build-std=std,panic_abort \
            -Z build-std-features=panic_immediate_abort

          mkdir -p "$OUT"
          cp "target/armv7-apple-ios7/release/libdonuthle.a" "$OUT/"
          ls -l "$OUT/libdonuthle.a"
