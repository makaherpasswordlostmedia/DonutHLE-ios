      - name: Fix aput opcode (0x4b was executed as aget; caused endless array-init loops)
        run: |
          set -e
          cat > /tmp/aput_fix.py <<'__DH_PY21__'
          # Dalvik opcode map fix: 0x4b is `aput` (int), 0x44..=0x4a are the aget family. The interpreter treated 0x4b as an
          # aget and started aput at 0x4c, so `aput vA, vB, vC` read the array instead of writing it. Array-init loops like
          # `for (i = 0; i < n; i++) a[i] = i;` (Armored Strike RSL/a.<init>) then never terminated.
          import sys
          p = 'src/vm.rs'
          s = open(p).read()
          if '0x44..=0x4a => {' in s:
              print('aput fix already patched'); sys.exit(0)
          edits = [
           ('                0x44..=0x4b => {\n                    let (dest, array_reg, index_reg) =',
            '                0x44..=0x4a => {\n                    let (dest, array_reg, index_reg) ='),
           ('                0x4c..=0x51 => {\n                    let (value_reg, array_reg, index_reg) =',
            '                0x4b..=0x51 => {\n                    let (value_reg, array_reg, index_reg) ='),
          ]
          for a, b in edits:
              if s.count(a) != 1:
                  sys.exit('anchor missing or ambiguous (%d): %r' % (s.count(a), a[:70]))
              s = s.replace(a, b, 1)
          open(p, 'w').write(s)
          print('aput fix patched')
          __DH_PY21__
          python3 /tmp/aput_fix.py

      - name: Add launch diagnostics (Documents/donuthle.log, live boot status, launch timeout)
        run: |
          set -e
          cat > /tmp/dhlog.rs <<'__DH_RS__'
          //! Launch diagnostics: file log, phase tracking, VM sampling, launch timeout and a non-blocking status dump.
          use std::collections::hash_map::DefaultHasher;
          use std::collections::HashMap;
          use std::ffi::{CStr, CString};
          use std::fs::{File, OpenOptions};
          use std::hash::{Hash, Hasher};
          use std::io::Write;
          use std::os::raw::c_char;
          use std::sync::atomic::{AtomicBool, AtomicU64, AtomicUsize, Ordering};
          use std::sync::Mutex;
          use std::time::Instant;

          const RING_N: usize = 16;
          const STACK_N: usize = 300;
          const APP_LOG_LIMIT: usize = 400;

          static LOG_FILE: Mutex<Option<File>> = Mutex::new(None);
          static EPOCH: Mutex<Option<Instant>> = Mutex::new(None);
          static LAUNCH_T0: Mutex<Option<Instant>> = Mutex::new(None);
          static PHASE: Mutex<String> = Mutex::new(String::new());
          static METHODS: Mutex<Vec<String>> = Mutex::new(Vec::new());
          static NATIVES: Mutex<Trace> = Mutex::new(Trace::new());
          static STUBS: Mutex<Trace> = Mutex::new(Trace::new());

          static TRACE_ON: AtomicBool = AtomicBool::new(false);
          static LAUNCHING: AtomicBool = AtomicBool::new(false);
          static FRAME_MODE: AtomicBool = AtomicBool::new(false);
          static TIMEOUT_SECS: AtomicU64 = AtomicU64::new(300);
          static STEPS: AtomicUsize = AtomicUsize::new(0);
          static DEPTH: AtomicUsize = AtomicUsize::new(0);
          static PC: AtomicUsize = AtomicUsize::new(0);
          static LAST_STEPS: AtomicUsize = AtomicUsize::new(0);
          static LAST_MS: AtomicU64 = AtomicU64::new(0);
          static SLEEP_COUNT: AtomicU64 = AtomicU64::new(0);
          static SLEEP_MS: AtomicU64 = AtomicU64::new(0);
          static APP_LOGS: AtomicUsize = AtomicUsize::new(0);
          static RING_POS: AtomicUsize = AtomicUsize::new(0);
          #[allow(clippy::declare_interior_mutable_const)]
          const ZERO: AtomicUsize = AtomicUsize::new(0);
          static RING: [AtomicUsize; RING_N] = [ZERO; RING_N];
          static STACK: [AtomicUsize; STACK_N] = [ZERO; STACK_N];
          static CALLS: AtomicU64 = AtomicU64::new(0);

          struct Trace {
              ring: Vec<u64>,
              pos: usize,
              counts: Option<HashMap<u64, (String, u64)>>,
          }

          impl Trace {
              const fn new() -> Self {
                  Self {
                      ring: Vec::new(),
                      pos: 0,
                      counts: None,
                  }
              }

              /// Counts one call; returns the new count for this name.
              fn hit(&mut self, class_name: &str, method_name: &str) -> u64 {
                  let mut hasher = DefaultHasher::new();
                  class_name.hash(&mut hasher);
                  method_name.hash(&mut hasher);
                  let key = hasher.finish();
                  let counts = self.counts.get_or_insert_with(HashMap::new);
                  let entry = counts
                      .entry(key)
                      .or_insert_with(|| (format!("{class_name}->{method_name}"), 0));
                  entry.1 += 1;
                  let count = entry.1;
                  if self.ring.len() < RING_N {
                      self.ring.push(key);
                  } else {
                      let at = self.pos % RING_N;
                      self.ring[at] = key;
                  }
                  self.pos += 1;
                  count
              }

              fn recent(&self, limit: usize) -> String {
                  let Some(counts) = self.counts.as_ref() else {
                      return String::new();
                  };
                  let mut out = Vec::new();
                  for i in 0..limit.min(self.ring.len()) {
                      let at = (self.pos + RING_N * 2 - 1 - i) % RING_N;
                      if let Some(key) = self.ring.get(at) {
                          if let Some((name, _)) = counts.get(key) {
                              out.push(name.clone());
                          }
                      }
                  }
                  out.join(" <- ")
              }

              fn top(&self, limit: usize) -> String {
                  let Some(counts) = self.counts.as_ref() else {
                      return String::new();
                  };
                  let mut all: Vec<&(String, u64)> = counts.values().collect();
                  all.sort_by(|a, b| b.1.cmp(&a.1));
                  all.iter()
                      .take(limit)
                      .map(|(name, count)| format!("{name} x{count}"))
                      .collect::<Vec<_>>()
                      .join(", ")
              }
          }

          fn now_ms() -> u64 {
              match EPOCH.try_lock() {
                  Ok(guard) => guard
                      .as_ref()
                      .map(|t| t.elapsed().as_millis() as u64)
                      .unwrap_or(0),
                  Err(_) => 0,
              }
          }

          fn launch_secs() -> u64 {
              match LAUNCH_T0.try_lock() {
                  Ok(guard) => guard.as_ref().map(|t| t.elapsed().as_secs()).unwrap_or(0),
                  Err(_) => 0,
              }
          }

          fn write_line(msg: &str, blocking: bool) {
              let t = now_ms();
              let guard = if blocking {
                  LOG_FILE.lock().ok()
              } else {
                  LOG_FILE.try_lock().ok()
              };
              if let Some(mut guard) = guard {
                  if let Some(file) = guard.as_mut() {
                      let _ = writeln!(file, "[{:>8.3}] {}", t as f64 / 1000.0, msg);
                  }
              }
          }

          pub fn log(msg: &str) {
              write_line(msg, true);
          }

          pub fn phase(name: &str) {
              if let Ok(mut phase) = PHASE.lock() {
                  *phase = name.to_owned();
              }
              write_line(
                  &format!(
                      "PHASE {name} (steps={}, launch={}s)",
                      STEPS.load(Ordering::Relaxed),
                      launch_secs()
                  ),
                  true,
              );
          }

          pub fn set_methods(names: Vec<String>) {
              if let Ok(mut methods) = METHODS.lock() {
                  *methods = names;
              }
          }

          pub fn launch_begin(path: &str) {
              if let Ok(mut t) = LAUNCH_T0.lock() {
                  *t = Some(Instant::now());
              }
              for counter in [&STEPS, &DEPTH, &PC, &LAST_STEPS, &APP_LOGS, &RING_POS] {
                  counter.store(0, Ordering::Relaxed);
              }
              CALLS.store(0, Ordering::Relaxed);
              LAST_MS.store(0, Ordering::Relaxed);
              SLEEP_COUNT.store(0, Ordering::Relaxed);
              SLEEP_MS.store(0, Ordering::Relaxed);
              if let Ok(mut t) = NATIVES.lock() {
                  *t = Trace::new();
              }
              if let Ok(mut t) = STUBS.lock() {
                  *t = Trace::new();
              }
              set_methods(Vec::new());
              TRACE_ON.store(true, Ordering::Relaxed);
              LAUNCHING.store(true, Ordering::Relaxed);
              phase(&format!(
                  "launch begin: {path} (timeout {}s)",
                  TIMEOUT_SECS.load(Ordering::Relaxed)
              ));
          }

          pub fn launch_end(error: Option<String>) {
              LAUNCHING.store(false, Ordering::Relaxed);
              TRACE_ON.store(false, Ordering::Relaxed);
              match error {
                  Some(error) => write_line(
                      &format!("LAUNCH FAILED after {}s: {error}", launch_secs()),
                      true,
                  ),
                  None => write_line(&format!("LAUNCH OK after {}s", launch_secs()), true),
              }
              write_line(&full_status(), true);
          }

          #[inline]
          pub fn enter(method_index: usize, depth: usize) {
              let at = RING_POS.fetch_add(1, Ordering::Relaxed);
              RING[at % RING_N].store(method_index, Ordering::Relaxed);
              CALLS.fetch_add(1, Ordering::Relaxed);
              if depth < STACK_N {
                  STACK[depth].store(method_index, Ordering::Relaxed);
              }
          }

          /// Called every 65536 interpreter steps. `Some(message)` asks the VM to abort the launch.
          pub fn tick(steps: usize, depth: usize, pc: usize, frame_mode: bool) -> Option<String> {
              STEPS.store(steps, Ordering::Relaxed);
              DEPTH.store(depth, Ordering::Relaxed);
              PC.store(pc, Ordering::Relaxed);
              FRAME_MODE.store(frame_mode, Ordering::Relaxed);
              if !LAUNCHING.load(Ordering::Relaxed) {
                  return None;
              }
              let limit = TIMEOUT_SECS.load(Ordering::Relaxed);
              if limit == 0 {
                  return None;
              }
              let elapsed = launch_secs();
              if elapsed < limit {
                  return None;
              }
              let message = format!(
                  "launch timed out after {elapsed}s ({steps} steps). {} Set NSUserDefaults 'launchtimeout' (seconds, 0 = off) to change.",
                  short_status()
              );
              write_line(&message, true);
              Some(message)
          }

          pub fn native_call(class_name: &str, method_name: &str) {
              if !TRACE_ON.load(Ordering::Relaxed) {
                  return;
              }
              if let Ok(mut t) = NATIVES.lock() {
                  t.hit(class_name, method_name);
              }
          }

          pub fn auto_stub(class_name: &str, method_name: &str) {
              let count = match STUBS.lock() {
                  Ok(mut t) => t.hit(class_name, method_name),
                  Err(_) => return,
              };
              // log the first hit and every power of ten after it
              let mut p = 1u64;
              while p < count {
                  p = p.saturating_mul(10);
              }
              if count == p {
                  write_line(&format!("auto-stub {class_name}->{method_name} x{count}"), true);
              }
          }

          pub fn sleep_note(ms: u64, frame_mode: bool) {
              let n = SLEEP_COUNT.fetch_add(1, Ordering::Relaxed) + 1;
              SLEEP_MS.fetch_add(ms, Ordering::Relaxed);
              if !frame_mode && n <= 10 {
                  write_line(&format!("Thread.sleep({ms}) during launch (call #{n})"), true);
              }
          }

          pub fn app_log(kind: &str, message: &str) {
              let n = APP_LOGS.fetch_add(1, Ordering::Relaxed);
              if n < APP_LOG_LIMIT {
                  let cut: String = message.chars().take(300).collect();
                  write_line(&format!("app Log/{kind}: {cut}"), true);
              }
          }

          fn method_name(index: usize, names: &[String]) -> String {
              names
                  .get(index)
                  .cloned()
                  .unwrap_or_else(|| format!("#{index}"))
          }

          fn recent_methods(limit: usize) -> String {
              let pos = RING_POS.load(Ordering::Relaxed);
              let Ok(names) = METHODS.try_lock() else {
                  return String::new();
              };
              let mut out = Vec::new();
              for i in 0..limit.min(pos).min(RING_N) {
                  let at = (pos - 1 - i) % RING_N;
                  out.push(method_name(RING[at].load(Ordering::Relaxed), &names));
              }
              out.join(" <- ")
          }

          fn short_name(full: &str) -> String {
              full.trim_start_matches("Lcom/requiem/")
                  .trim_start_matches("Landroid/")
                  .replace(';', "")
          }

          /// Shadow call stack: frames 0..depth (outermost first), then the last callee entered at `depth`.
          fn stack_string(last_frames: usize) -> String {
              let depth = DEPTH.load(Ordering::Relaxed).min(STACK_N - 1);
              let Ok(names) = METHODS.try_lock() else {
                  return String::new();
              };
              let from = (depth + 1).saturating_sub(last_frames);
              let mut out = Vec::new();
              for d in from..=depth {
                  let idx = STACK[d].load(Ordering::Relaxed);
                  out.push(short_name(&method_name(idx, &names)));
              }
              out.join(" > ")
          }

          fn phase_name() -> String {
              PHASE.try_lock().map(|p| p.clone()).unwrap_or_default()
          }

          pub fn short_status() -> String {
              let natives = NATIVES
                  .try_lock()
                  .map(|t| t.recent(2))
                  .unwrap_or_default();
              format!(
                  "phase: {}\nsteps: {} depth: {} calls: {}\nstack: {}\nnative: {}",
                  phase_name(),
                  STEPS.load(Ordering::Relaxed),
                  DEPTH.load(Ordering::Relaxed),
                  CALLS.load(Ordering::Relaxed),
                  stack_string(6),
                  natives
              )
          }

          pub fn full_status() -> String {
              let steps = STEPS.load(Ordering::Relaxed);
              let ms = now_ms();
              let prev_steps = LAST_STEPS.swap(steps, Ordering::Relaxed);
              let prev_ms = LAST_MS.swap(ms, Ordering::Relaxed);
              let rate = if ms > prev_ms {
                  (steps.saturating_sub(prev_steps) as u64) * 1000 / (ms - prev_ms)
              } else {
                  0
              };
              let (recent, top) = match NATIVES.try_lock() {
                  Ok(t) => (t.recent(RING_N), t.top(8)),
                  Err(_) => (String::new(), String::new()),
              };
              let stubs = STUBS.try_lock().map(|t| t.top(6)).unwrap_or_default();
              format!(
                  "STATUS phase={} launching={} launch={}s steps={} ({} steps/s) depth={} pc={} frame_mode={}\n  stack: {}\n  calls: {}\n  last methods: {}\n  last natives: {}\n  top natives: {}\n  top auto-stubs: {}\n  sleeps: {} calls / {} ms; app logs: {}",
                  phase_name(),
                  LAUNCHING.load(Ordering::Relaxed),
                  launch_secs(),
                  steps,
                  rate,
                  DEPTH.load(Ordering::Relaxed),
                  PC.load(Ordering::Relaxed),
                  FRAME_MODE.load(Ordering::Relaxed),
                  stack_string(40),
                  CALLS.load(Ordering::Relaxed),
                  recent_methods(RING_N),
                  recent,
                  top,
                  stubs,
                  SLEEP_COUNT.load(Ordering::Relaxed),
                  SLEEP_MS.load(Ordering::Relaxed),
                  APP_LOGS.load(Ordering::Relaxed)
              )
          }

          /// # Safety
          ///
          /// `path` must be a valid NUL-terminated C string.
          #[no_mangle]
          pub unsafe extern "C" fn donuthle_log_open(path: *const c_char) -> i32 {
              if path.is_null() {
                  return 0;
              }
              let Ok(path) = CStr::from_ptr(path).to_str() else {
                  return 0;
              };
              let Ok(file) = OpenOptions::new().create(true).append(true).open(path) else {
                  return 0;
              };
              if let Ok(mut t) = EPOCH.lock() {
                  *t = Some(Instant::now());
              }
              if let Ok(mut f) = LOG_FILE.lock() {
                  *f = Some(file);
              }
              std::panic::set_hook(Box::new(|info| {
                  write_line(&format!("PANIC: {info}"), false);
                  write_line(&full_status(), false);
              }));
              write_line("log opened", true);
              1
          }

          /// # Safety
          ///
          /// `msg` must be a valid NUL-terminated C string.
          #[no_mangle]
          pub unsafe extern "C" fn donuthle_log_write(msg: *const c_char) {
              if msg.is_null() {
                  return;
              }
              log(&CStr::from_ptr(msg).to_string_lossy());
          }

          /// Short status for on-screen display. Free with `donuthle_free_string`.
          #[no_mangle]
          pub extern "C" fn donuthle_log_status() -> *mut c_char {
              CString::new(short_status().replace('\0', " "))
                  .unwrap_or_default()
                  .into_raw()
          }

          /// Writes the full status block to the log file.
          #[no_mangle]
          pub extern "C" fn donuthle_log_dump() {
              write_line(&full_status(), false);
          }

          /// Launch timeout in seconds, 0 disables it. Default 300.
          #[no_mangle]
          pub extern "C" fn donuthle_set_launch_timeout(secs: u32) {
              TIMEOUT_SECS.store(u64::from(secs), Ordering::Relaxed);
          }
          __DH_RS__
