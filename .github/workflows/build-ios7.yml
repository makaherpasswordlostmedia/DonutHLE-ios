              glColorPointer(4, GL_UNSIGNED_BYTE, 24, v + 20);
              glDrawArrays(mode, 0, (GLsizei)count);
          }

          - (void)replayQuad:(const uint8_t *)p {
              DHState st; memcpy(&st, p, sizeof st);
              const uint8_t *q = p + sizeof st;
              float x = rdf(q), y = rdf(q + 4), w = rdf(q + 8), h = rdf(q + 12);
              float u0 = rdf(q + 16), v0 = rdf(q + 20), u1 = rdf(q + 24), v1 = rdf(q + 28);
              const uint8_t *c = q + 32;
